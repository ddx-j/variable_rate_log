<script type="text/babel">
const { useState, useMemo, useEffect } = React;

function round(hours) {
  // 0-15 min down, 16-45 nearest half, 46-60 up
  const wholeHours = Math.floor(hours);
  const minutes = (hours - wholeHours) * 60;
  let add;
  if (minutes <= 15) add = 0;
  else if (minutes <= 45) add = 0.5;
  else add = 1;
  return wholeHours + add;
}

function diffHours(start, end) {
  if (!start || !end) return 0;
  const [sh, sm] = start.split(':').map(Number);
  const [eh, em] = end.split(':').map(Number);
  let mins = (eh * 60 + em) - (sh * 60 + sm);
  if (mins < 0) mins += 24 * 60;
  return mins / 60;
}

function fmtHours(h) {
  const whole = Math.floor(h);
  const frac = h - whole;
  if (frac === 0) return `${whole} hr`;
  if (frac === 0.5) return `${whole}.5 hr`;
  return `${h.toFixed(2)} hr`;
}

function nowTimeStr() {
  const d = new Date();
  const hh = String(d.getHours()).padStart(2, '0');
  const mm = String(d.getMinutes()).padStart(2, '0');
  return `${hh}:${mm}`;
}

function fmtElapsed(ms) {
  const totalSec = Math.floor(ms / 1000);
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  const pad = n => String(n).padStart(2, '0');
  return `${pad(h)}:${pad(m)}:${pad(s)}`;
}

function fmt12Hour(time24) {
  if (!time24) return '';
  const [h, m] = time24.split(':').map(Number);
  const period = h >= 12 ? 'PM' : 'AM';
  let h12 = h % 12;
  if (h12 === 0) h12 = 12;
  return `${h12}:${String(m).padStart(2, '0')} ${period}`;
}

function todayStr() {
  const d = new Date();
  return d.toISOString().slice(0, 10);
}

function fmtFilenameDate(dateStr) {
  const d = dateStr ? new Date(dateStr + 'T00:00:00') : new Date();
  const day = String(d.getDate()).padStart(2, '0');
  const month = String(d.getMonth() + 1).padStart(2, '0');
  const year = d.getFullYear();
  return `${day}${month}${year}`;
}

function App() {
  const [projectTitle, setProjectTitle] = useState(() => {
    try {
      return localStorage.getItem('vrlProjectTitle') || '';
    } catch (e) {
      return '';
    }
  });
  const [projectDate, setProjectDate] = useState(() => {
    try {
      return localStorage.getItem('vrlProjectDate') || todayStr();
    } catch (e) {
      return todayStr();
    }
  });
  const [billedTo, setBilledTo] = useState(() => {
    try {
      return localStorage.getItem('vrlBilledTo') || '';
    } catch (e) {
      return '';
    }
  });
  const [invoiceNumber, setInvoiceNumber] = useState(() => {
    try {
      const stored = localStorage.getItem('shootTrackerNextInvoiceNumber');
      return stored ? Number(stored) : 1011;
    } catch (e) {
      return 1011;
    }
  });
  const [exportHistory, setExportHistory] = useState(() => {
    try {
      const stored = localStorage.getItem('shootTrackerExportHistory');
      return stored ? JSON.parse(stored) : [];
    } catch (e) {
      return [];
    }
  });
  const [showHistory, setShowHistory] = useState(false);
  const [defaultRate, setDefaultRate] = useState(() => {
    try {
      const stored = localStorage.getItem('vrlDefaultRate');
      return stored ? Number(stored) : 50;
    } catch (e) {
      return 50;
    }
  });
  const [sessions, setSessions] = useState(() => {
    try {
      const stored = localStorage.getItem('vrlSessions');
      return stored ? JSON.parse(stored) : [
        { id: 1, label: 'Shoot', start: '', end: '', date: todayStr(), notes: '', onBreak: false, breakStart: null, breakMs: 0, rate: 50 },
        { id: 2, label: 'Edit — session 1', start: '', end: '', date: todayStr(), notes: '', onBreak: false, breakStart: null, breakMs: 0, rate: 50 },
      ];
    } catch (e) {
      return [
        { id: 1, label: 'Shoot', start: '', end: '', date: todayStr(), notes: '', onBreak: false, breakStart: null, breakMs: 0, rate: 50 },
        { id: 2, label: 'Edit — session 1', start: '', end: '', date: todayStr(), notes: '', onBreak: false, breakStart: null, breakMs: 0, rate: 50 },
      ];
    }
  });
  const [nextId, setNextId] = useState(3);
  const [copied, setCopied] = useState(false);
  const [now, setNow] = useState(Date.now());
  const [showImport, setShowImport] = useState(false);
  const [importText, setImportText] = useState('');

  const anyRunning = sessions.some(s => s.runningSince);

  useEffect(() => {
    if (!anyRunning) return;
    const interval = setInterval(() => setNow(Date.now()), 1000);
    return () => clearInterval(interval);
  }, [anyRunning]);

  useEffect(() => {
    try {
      localStorage.setItem('vrlProjectTitle', projectTitle);
      localStorage.setItem('vrlProjectDate', projectDate);
      localStorage.setItem('vrlBilledTo', billedTo);
      localStorage.setItem('vrlInvoiceNumber', String(invoiceNumber));
      localStorage.setItem('vrlDefaultRate', String(defaultRate));
      localStorage.setItem('vrlSessions', JSON.stringify(sessions));
    } catch (e) {
      // localStorage may be unavailable
    }
  }, [projectTitle, projectDate, billedTo, invoiceNumber, defaultRate, sessions]);

  const handlePunch = (id) => {
    setSessions(prev => prev.map(s => {
      if (s.id !== id) return s;
      if (s.runningSince) {
        // punching out — close out any active break first
        let finalBreakMs = s.breakMs || 0;
        if (s.onBreak && s.breakStart) {
          finalBreakMs += Date.now() - s.breakStart;
        }
        return { ...s, end: nowTimeStr(), runningSince: null, onBreak: false, breakStart: null, breakMs: finalBreakMs };
      }
      // punching in
      return { ...s, start: nowTimeStr(), end: '', runningSince: Date.now(), date: todayStr(), onBreak: false, breakStart: null, breakMs: 0 };
    }));
  };

  const handleBreak = (id) => {
    setSessions(prev => prev.map(s => {
      if (s.id !== id || !s.runningSince) return s;
      if (s.onBreak) {
        // resume — add elapsed break time
        const addedMs = s.breakStart ? Date.now() - s.breakStart : 0;
        return { ...s, onBreak: false, breakStart: null, breakMs: (s.breakMs || 0) + addedMs };
      }
      // start break
      return { ...s, onBreak: true, breakStart: Date.now() };
    }));
  };

  const handleClear = (id) => {
    setSessions(prev => prev.map(s => s.id === id
      ? { ...s, start: '', end: '', runningSince: null, onBreak: false, breakStart: null, breakMs: 0 }
      : s
    ));
  };

  const updateSession = (id, field, value) => {
    setSessions(prev => prev.map(s => s.id === id ? { ...s, [field]: value } : s));
  };

  const addSession = () => {
    setSessions(prev => [...prev, { id: nextId, label: `Edit — session ${prev.length}`, start: '', end: '', runningSince: null, date: todayStr(), notes: '', onBreak: false, breakStart: null, breakMs: 0, rate: defaultRate }]);
    setNextId(n => n + 1);
  };

  const removeSession = (id) => {
    setSessions(prev => prev.filter(s => s.id !== id));
  };

  const importSession = () => {
    // Reads the Copy Summary format, one line per session:
    // Label (YYYY-MM-DD): 7:30 AM–1:45 PM → 6 hr @ $15/hr = $90
    //    note: optional note
    // Header, "Total:" and other lines are ignored.
    if (!importText.trim()) return;

    const to24 = (t, ap) => {
      let [h, m] = t.split(':').map(Number);
      const isPM = ap.toUpperCase() === 'PM';
      if (isPM && h !== 12) h += 12;
      if (!isPM && h === 12) h = 0;
      return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
    };

    const entryRe = /^(.+?)\s*\((\d{4}-\d{2}-\d{2})\):\s*(\d{1,2}:\d{2})\s*(AM|PM)\s*[–-]\s*(\d{1,2}:\d{2})\s*(AM|PM)(?:.*?@\s*\$?([\d.]+))?/i;
    const noteRe = /^note:\s*(.*)$/i;

    const parsed = [];
    importText.split('\n').forEach(raw => {
      const line = raw.trim();
      if (!line) return;
      const noteMatch = line.match(noteRe);
      if (noteMatch) {
        if (parsed.length) parsed[parsed.length - 1].notes = noteMatch[1].trim();
        return;
      }
      const m = line.match(entryRe);
      if (m) {
        parsed.push({
          label: m[1].trim(),
          date: m[2],
          start: to24(m[3], m[4]),
          end: to24(m[5], m[6]),
          rate: m[7] ? Number(m[7]) : defaultRate,
          notes: ''
        });
      }
    });

    if (!parsed.length) return;

    let id = nextId;
    const newSessions = parsed.map(s => ({
      id: id++,
      ...s,
      onBreak: false,
      breakStart: null,
      breakMs: 0,
      runningSince: null
    }));

    setSessions(prev => [...prev, ...newSessions]);
    setNextId(id);
    setImportText('');
    setShowImport(false);
  };

  const computed = useMemo(() => {
    return sessions.map(s => {
      let raw = diffHours(s.start, s.end);
      const breakHours = (s.breakMs || 0) / 3600000;
      raw = Math.max(0, raw - breakHours);
      const rounded = raw > 0 ? round(raw) : 0;
      const sessionRate = Number(s.rate) || 0;
      const cost = rounded * sessionRate;
      return { ...s, raw, rounded, cost };
    });
  }, [sessions]);

  const totalRounded = computed.reduce((sum, s) => sum + s.rounded, 0);
  const totalCost = computed.reduce((sum, s) => sum + s.cost, 0);

  const buildSummary = () => {
    const lines = [];
    lines.push(projectTitle ? projectTitle : 'Untitled Project');
    lines.push(projectDate || todayStr());
    lines.push('');
    computed.forEach(s => {
      if (s.raw > 0) {
        lines.push(`${s.label} (${s.date || 'no date'}): ${fmt12Hour(s.start)}–${fmt12Hour(s.end)} → ${fmtHours(s.rounded)} @ $${s.rate}/hr = $${s.cost.toFixed(0)}`);
        if (s.notes) lines.push(`   note: ${s.notes}`);
      } else {
        lines.push(`${s.label}: (no time logged)`);
      }
    });
    lines.push('');
    lines.push(`Total: ${fmtHours(totalRounded)} → $${totalCost.toFixed(0)}`);
    return lines.join('\n');
  };

  const handleExport = async () => {
    const text = buildSummary();
    try {
      await navigator.clipboard.writeText(text);
      setCopied(true);
      setTimeout(() => setCopied(false), 2000);
    } catch (e) {
      // fallback: select-and-copy not available, just show the text
      window.prompt('Copy this summary:', text);
    }
  };

  const escapeHTML = (val) => String(val)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');

  const buildStyledExcel = () => {
    const accent = '#dcefe6';
    const ink = '#1c1a17';
    const rowsHTML = computed.map(s => `
      <tr>
        <td>${escapeHTML(s.label)}</td>
        <td>${escapeHTML(s.date || '')}</td>
        <td>${escapeHTML(s.start ? fmt12Hour(s.start) : '')}</td>
        <td>${escapeHTML(s.end ? fmt12Hour(s.end) : '')}</td>
        <td align="right">${s.raw > 0 ? s.rounded : ''}</td>
        <td align="right">${s.raw > 0 ? `$${s.rate}/hr` : ''}</td>
        <td align="right">${s.raw > 0 ? `$${s.cost.toFixed(0)}` : ''}</td>
        <td style="color:#6b655a;font-style:italic;">${escapeHTML(s.notes || '')}</td>
      </tr>`).join('');

    return `
      <html>
      <head><meta charset="UTF-8"></head>
      <body style="font-family:Calibri, Arial, sans-serif;">
        <table border="0" cellspacing="0" cellpadding="6">
          <tr><td style="font-size:16px;font-weight:bold;color:${ink};" colspan="8">${escapeHTML(projectTitle || 'Untitled Project')}</td></tr>
          <tr><td style="font-weight:bold;">Billed To</td><td colspan="7">${escapeHTML(billedTo || '')}</td></tr>
          <tr><td style="font-weight:bold;">Invoice Date</td><td colspan="7">${escapeHTML(projectDate || todayStr())}</td></tr>
          <tr><td colspan="8"></td></tr>
          <tr style="background:${accent};color:${ink};font-weight:bold;">
            <td>Session</td><td>Date Worked</td><td>Start</td><td>End</td><td align="right">Rounded Hours</td><td align="right">Rate</td><td align="right">Amount</td><td>Notes</td>
          </tr>
          ${rowsHTML}
          <tr><td colspan="8"></td></tr>
          <tr style="background:${accent};color:${ink};font-weight:bold;font-size:14px;">
            <td colspan="4">TOTAL</td>
            <td align="right">${totalRounded}</td>
            <td></td>
            <td align="right">$${totalCost.toFixed(0)}</td>
            <td></td>
          </tr>
        </table>
      </body>
      </html>`;
  };

  const logExport = (entry) => {
    setExportHistory(prev => {
      const updated = [{ ...entry, loggedAt: Date.now() }, ...prev].slice(0, 100);
      try {
        localStorage.setItem('shootTrackerExportHistory', JSON.stringify(updated));
      } catch (e) { /* ignore */ }
      return updated;
    });
  };

  const handleExportExcel = () => {
    const html = buildStyledExcel();
    const blob = new Blob(['\ufeff' + html], { type: 'application/vnd.ms-excel' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${fmtFilenameDate(projectDate)}_invoice_${invoiceNumber}.xls`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    logExport({
      type: 'Excel',
      project: projectTitle || 'Untitled Project',
      date: projectDate || todayStr(),
      hours: totalRounded,
      total: totalCost,
    });
  };

  const handleDownloadInvoicePDF = () => {
    const nextNum = invoiceNumber + 1;
    const finalize = () => {
      try {
        localStorage.setItem('shootTrackerNextInvoiceNumber', String(nextNum));
      } catch (e) { /* ignore */ }
      setInvoiceNumber(nextNum);
    };

    if (!window.jspdf) {
      window.alert('PDF library did not load — check your connection and try again.');
      return;
    }

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: 'pt', format: 'letter' });
    const accent = [220, 239, 230];
    const ink = [28, 26, 23];
    const gray = [107, 101, 90];
    const margin = 40;

    doc.setFont('helvetica', 'bold');
    doc.setFontSize(24);
    doc.setTextColor(...ink);
    doc.text('INVOICE', margin, 55);
    doc.setDrawColor(...accent);
    doc.setLineWidth(2.5);
    doc.line(margin, 65, doc.internal.pageSize.getWidth() - margin, 65);

    doc.setFont('helvetica', 'normal');
    doc.setFontSize(10);
    doc.setTextColor(...gray);
    const rightX = doc.internal.pageSize.getWidth() - margin;
    doc.text(`Invoice #: ${invoiceNumber}`, rightX, 30, { align: 'right' });
    doc.text(`Date: ${projectDate || todayStr()}`, rightX, 43, { align: 'right' });
    doc.setFont('helvetica', 'bold');
    doc.text(`Project: ${projectTitle || 'Untitled Project'}`, rightX, 56, { align: 'right' });
    doc.setFont('helvetica', 'normal');

    doc.setFont('helvetica', 'bold');
    doc.setFontSize(12);
    doc.setTextColor(...ink);
    doc.text('Deanna Jackson', margin, 90);

    doc.setFont('helvetica', 'normal');
    doc.setFontSize(10);
    doc.setTextColor(...gray);
    doc.text('Billed To', margin, 112);
    doc.setTextColor(...ink);
    doc.setFontSize(11);
    doc.text(billedTo || '—', margin, 126);

    const tableRows = [];
    computed.filter(s => s.raw > 0).forEach(s => {
      let desc = s.label;
      if (s.notes) desc += `\n${s.notes}`;
      tableRows.push([
        s.date || '',
        desc,
        fmtHours(s.rounded),
        `$${s.rate}/hr`,
        `$${s.cost.toFixed(0)}`,
      ]);
    });

    doc.autoTable({
      startY: 145,
      margin: { left: margin, right: margin },
      head: [['Date', 'Description', 'Hours', 'Rate', 'Amount']],
      body: tableRows,
      styles: { font: 'helvetica', fontSize: 10, cellPadding: 6 },
      headStyles: { fillColor: accent, textColor: ink, fontStyle: 'bold', fontSize: 9 },
      bodyStyles: { textColor: ink },
      alternateRowStyles: { fillColor: [247, 244, 238] },
    });

    const finalY = doc.lastAutoTable.finalY + 20;
    const boxX = doc.internal.pageSize.getWidth() - margin - 200;

    doc.setFont('helvetica', 'normal');
    doc.setFontSize(11);
    doc.setTextColor(...ink);
    doc.text('Total Hours', boxX, finalY);
    doc.text(fmtHours(totalRounded), rightX, finalY, { align: 'right' });

    doc.setDrawColor(...ink);
    doc.setLineWidth(1);
    doc.line(boxX, finalY + 26, rightX, finalY + 26);

    doc.setFont('helvetica', 'bold');
    doc.setFontSize(15);
    doc.text('Total Due', boxX, finalY + 44);
    doc.text(`$${totalCost.toFixed(0)}`, rightX, finalY + 44, { align: 'right' });

    doc.save(`${fmtFilenameDate(projectDate)}_invoice_${invoiceNumber}.pdf`);
    logExport({
      type: 'PDF Invoice',
      project: projectTitle || 'Untitled Project',
      date: projectDate || todayStr(),
      invoiceNum: invoiceNumber,
      hours: totalRounded,
      total: totalCost,
    });
    finalize();
  };

  return (
    <div>
      <div className="slate">
        <div className="slate-top"></div>
        <h1>Variable Rate Log</h1>
        <p>Track sessions below — hours round to the nearest half hour, each at its own rate.</p>
      </div>

      <div className="project-row">
        <div className="project-field">
          <label>Project</label>
          <input
            type="text"
            placeholder="e.g. Sarah — Instagram promo"
            value={projectTitle}
            onChange={e => setProjectTitle(e.target.value)}
          />
        </div>
        <div className="project-field">
          <label>Billed To</label>
          <input
            type="text"
            placeholder="e.g. Sarah Nguyen"
            value={billedTo}
            onChange={e => setBilledTo(e.target.value)}
          />
        </div>
        <div className="project-field">
          <label>Invoice Date</label>
          <input
            type="date"
            value={projectDate}
            onChange={e => setProjectDate(e.target.value)}
          />
        </div>
      </div>

      <div className="rate-row">
        <div className="invoice-num-field">
          <label>Invoice #</label>
          <input
            type="number"
            value={invoiceNumber}
            onChange={e => setInvoiceNumber(Number(e.target.value) || 0)}
          />
        </div>
        <div className="invoice-num-field" style={{ flex: '0 0 110px' }}>
          <label>Default $/hr</label>
          <input
            type="number"
            min="0"
            value={defaultRate}
            onChange={e => setDefaultRate(Number(e.target.value) || 0)}
          />
        </div>
      </div>
      <p style={{ fontFamily: 'var(--mono)', fontSize: 10, color: '#8a8375', margin: '-10px 0 16px' }}>
        "Default $/hr" only applies to new sessions you add — each session below has its own editable rate.
      </p>

      {computed.map(s => (
        <div className="session" key={s.id}>
          <div className="session-head">
            <input
              className="label-input"
              value={s.label}
              onChange={e => updateSession(s.id, 'label', e.target.value)}
            />
            {sessions.length > 1 && (
              <button className="remove-btn" onClick={() => removeSession(s.id)}>remove</button>
            )}
          </div>
          <div className="session-date-row">
            <div className="session-date-field">
              <label>Date worked</label>
              <input
                type="date"
                value={s.date || ''}
                onChange={e => updateSession(s.id, 'date', e.target.value)}
              />
            </div>
            <div className="session-date-field rate-field">
              <label>$/hr</label>
              <input
                type="number"
                min="0"
                value={s.rate}
                onChange={e => updateSession(s.id, 'rate', Number(e.target.value) || 0)}
              />
            </div>
          </div>
          <div className="time-row">
            <div className="time-field">
              <label>Start</label>
              <input type="time" value={s.start} onChange={e => updateSession(s.id, 'start', e.target.value)} />
            </div>
            <div className="time-field">
              <label>End</label>
              <input type="time" value={s.end} onChange={e => updateSession(s.id, 'end', e.target.value)} />
            </div>
          </div>
          <div className="punch-row">
            <button
              className={`punch-btn ${s.runningSince ? 'running' : ''}`}
              onClick={() => handlePunch(s.id)}
            >
              {s.runningSince ? 'punch out' : 'punch in'}
            </button>
            {s.runningSince && (
              <button
                className={`break-btn ${s.onBreak ? 'on-break' : ''}`}
                onClick={() => handleBreak(s.id)}
              >
                {s.onBreak ? 'resume' : 'break'}
              </button>
            )}
            <button className="clear-btn" onClick={() => handleClear(s.id)}>
              clear
            </button>
          </div>
          {s.runningSince && !s.onBreak && (
            <div className="punch-live">{fmtElapsed(now - s.runningSince - (s.breakMs || 0))} elapsed</div>
          )}
          {s.runningSince && s.onBreak && (
            <div className="break-live">on break — {fmtElapsed(now - s.breakStart)}</div>
          )}
          {s.raw > 0 && (
            <div className="session-result">
              {fmt12Hour(s.start)} – {fmt12Hour(s.end)}<br/>
              Raw: {s.raw.toFixed(2)} hr → Rounded: <strong>{fmtHours(s.rounded)}</strong> @ ${s.rate}/hr = <strong>${s.cost.toFixed(0)}</strong>
            </div>
          )}
          <div className="notes-row">
            <label>Notes</label>
            <textarea
              placeholder="e.g. reshot intro, added lower thirds..."
              value={s.notes || ''}
              onChange={e => updateSession(s.id, 'notes', e.target.value)}
            />
          </div>
        </div>
      ))}

      <div style={{ display: 'flex', gap: '10px', marginBottom: '22px' }}>
        <button className="add-btn" onClick={addSession} style={{ flex: 1, margin: 0 }}>+ add another session</button>
        <button className="add-btn" onClick={() => setShowImport(true)} style={{ flex: 1, margin: 0 }}>📥 import time card</button>
      </div>

      {showImport && (
        <div style={{
          position: 'fixed',
          top: 0, left: 0, right: 0, bottom: 0,
          background: 'rgba(0,0,0,0.5)',
          display: 'flex',
          alignItems: 'center',
          justifyContent: 'center',
          zIndex: 9999,
          padding: '20px'
        }}>
          <div style={{
            background: '#fff',
            borderRadius: '8px',
            padding: '24px',
            maxWidth: '500px',
            width: '100%',
            border: `2px solid var(--tape)`,
            boxShadow: '0 4px 12px rgba(0,0,0,0.15)'
          }}>
            <h2 style={{ margin: '0 0 12px', fontFamily: 'var(--mono)', fontSize: '16px', color: 'var(--ink)' }}>Import Time Card</h2>
            <p style={{ margin: '0 0 12px', fontFamily: 'var(--mono)', fontSize: '12px', color: '#6b655a' }}>
              Paste lines from Copy Summary. Format:<br/>
              Label (2026-10-20): 7:30 AM–1:45 PM → 6 hr @ $15/hr = $90<br/>
              &nbsp;&nbsp;&nbsp;note: optional note<br/>
              Multiple sessions can be pasted at once.
            </p>
            <textarea
              value={importText}
              onChange={e => setImportText(e.target.value)}
              style={{
                width: '100%',
                height: '200px',
                fontFamily: 'var(--mono)',
                fontSize: '12px',
                padding: '10px',
                border: `1px solid var(--line)`,
                borderRadius: '4px',
                boxSizing: 'border-box',
                marginBottom: '12px',
                resize: 'none'
              }}
              placeholder="Paste your time card data here..."
            />
            <div style={{ display: 'flex', gap: '10px', justifyContent: 'flex-end' }}>
              <button
                onClick={() => { setShowImport(false); setImportText(''); }}
                style={{
                  fontFamily: 'var(--mono)',
                  fontSize: '13px',
                  padding: '10px 16px',
                  border: `1px solid var(--line)`,
                  borderRadius: '4px',
                  background: '#fff',
                  color: 'var(--ink)',
                  cursor: 'pointer'
                }}
              >
                cancel
              </button>
              <button
                onClick={importSession}
                style={{
                  fontFamily: 'var(--mono)',
                  fontSize: '13px',
                  padding: '10px 16px',
                  border: `2px solid var(--tape)`,
                  borderRadius: '4px',
                  background: 'var(--tape)',
                  color: '#fff',
                  cursor: 'pointer',
                  fontWeight: 'bold'
                }}
              >
                import session
              </button>
            </div>
          </div>
        </div>
      )}

      <div className="total-card">
        <div className="total-row">
          <span>Total rounded hours</span>
          <span>{fmtHours(totalRounded)}</span>
        </div>
        <div className="total-row final">
          <span>Total</span>
          <span>${totalCost.toFixed(0)}</span>
        </div>
      </div>

      <div className="export-row">
        <button className={`export-btn ${copied ? 'copied' : ''}`} onClick={handleExport}>
          {copied ? '✓ copied' : 'copy summary'}
        </button>
        <button className="export-btn secondary" onClick={handleExportExcel}>
          download excel
        </button>
        <button className="export-btn secondary" onClick={handleDownloadInvoicePDF}>
          download pdf invoice
        </button>
      </div>

      <button className="history-toggle" onClick={() => setShowHistory(v => !v)}>
        {showHistory ? '▲ hide export history' : `▼ export history (${exportHistory.length})`}
      </button>
      {showHistory && (
        <div className="history-list">
          {exportHistory.length === 0 ? (
            <div className="history-empty">No exports yet on this device.</div>
          ) : (
            exportHistory.map((h, i) => (
              <div className="history-item" key={i}>
                <div className="hi-left">
                  <strong>{h.project}{h.invoiceNum ? ` — #${h.invoiceNum}` : ''}</strong>
                  {h.type} · {h.date}
                </div>
                <div className="hi-right">
                  {fmtHours(h.hours)}<br/>${h.total.toFixed(0)}
                </div>
              </div>
            ))
          )}
        </div>
      )}
      {showHistory && exportHistory.length > 0 && (
        <button
          className="history-clear"
          onClick={() => {
            if (window.confirm('Clear all export history on this device?')) {
              setExportHistory([]);
              try { localStorage.removeItem('shootTrackerExportHistory'); } catch (e) { /* ignore */ }
            }
          }}
        >
          clear history
        </button>
      )}

      <div className="rounding-note">
        Rounding rule: 0–15 min down · 16–45 min → nearest half hour · 46–60 min up.<br/>
        "Punch in" grabs the current time as Start; "punch out" grabs it as End — or just type times manually.<br/>
        "Break" pauses the timer without ending the session; "resume" picks back up — break time is subtracted from your total automatically.<br/>
        "Clear" resets that session's start/end/break data if you need to redo a punch.<br/>
        Each session has its own "Date worked" and a Notes field for quick comments.<br/>
        Entries are editable any time — click into any field to change it.<br/>
        "Download Excel" opens directly in Excel, Numbers, or Google Sheets, with a styled header.<br/>
        "Download PDF Invoice" saves the invoice directly as a PDF — no print dialog needed.<br/>
        "Export history" remembers past exports on this device/browser only — not synced elsewhere.<br/>
        This tracker resets if you close or reload the tab — export before you leave.
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
